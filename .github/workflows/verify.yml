name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy_core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q policy_core tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke resolve
        run: python -m policy_core.cli resolve --domain software --capability code_quality
